name: Deploy web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment to deploy
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: infrastructure
        run: |
          storage_account_name="$(az deployment sub show \
            --name vaylakaverit-${{ inputs.environment }} \
            --query properties.outputs.storageAccountName.value \
            --output tsv)"
          function_app_name="$(az deployment sub show \
            --name vaylakaverit-${{ inputs.environment }} \
            --query properties.outputs.functionAppName.value \
            --output tsv)"
          function_app_host_name="$(az functionapp show \
            --resource-group rg-vaylakaverit \
            --name "$function_app_name" \
            --query properties.defaultHostName \
            --output tsv)"
          echo "storage_account_name=$storage_account_name" >> "$GITHUB_OUTPUT"
          echo "function_app_host_name=$function_app_host_name" >> "$GITHUB_OUTPUT"
      - run: |
          VITE_API_ORIGIN="https://${{ steps.infrastructure.outputs.function_app_host_name }}" \
            pnpm --filter @vaylakaverit/web build
      - run: |
          az storage blob service-properties update \
            --auth-mode login \
            --account-name "${{ steps.infrastructure.outputs.storage_account_name }}" \
            --static-website true \
            --index-document index.html \
            --404-document index.html
          az storage blob upload-batch \
            --auth-mode login \
            --account-name "${{ steps.infrastructure.outputs.storage_account_name }}" \
            --destination '$web' \
            --source apps/web/dist \
            --overwrite true \
            --content-cache-control 'no-cache'
          az storage blob upload-batch \
            --auth-mode login \
            --account-name "${{ steps.infrastructure.outputs.storage_account_name }}" \
            --destination '$web/assets' \
            --source apps/web/dist/assets \
            --overwrite true \
            --content-cache-control 'public, max-age=31536000, immutable'
