name: Infrastructure validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-validate.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-validate.yml'

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-bicep@v2
      - run: bicep build infra/main.bicep
