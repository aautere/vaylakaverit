name: Infrastructure validation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-validate.yml'

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: az bicep install && az bicep build --file infra/main.bicep
